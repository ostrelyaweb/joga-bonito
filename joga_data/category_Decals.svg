<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Spray paint can. Body is the larger rounded rectangle; the smaller
       rectangle on top is the cap. Mist dots fly off the upper-right
       suggesting the nozzle is spraying. All currentColor so the tint
       helper paints the silhouette correctly under either theme. -->
  <rect x="9" y="4" width="4" height="3" rx="0.5"/>
  <rect x="7" y="7" width="8" height="13" rx="1.2"/>
  <line x1="7.5" y1="11" x2="14.5" y2="11"/>
  <line x1="7.5" y1="14" x2="14.5" y2="14"/>
  <circle cx="15.5" cy="4" r="0.6" fill="currentColor"/>
  <circle cx="17"   cy="2.5" r="0.7" fill="currentColor"/>
  <circle cx="18.5" cy="4.5" r="0.5" fill="currentColor"/>
  <circle cx="20"   cy="3"   r="0.5" fill="currentColor"/>
  <circle cx="16.5" cy="6"   r="0.4" fill="currentColor"/>
</svg>
